include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  # Mensajes que fallaron 3 veces terminan aquí para inspección manual.
  file-processing-dlq {}

  file-processing {
    # Si el worker no borra el mensaje en 30 s (falló o se cayó), SQS lo vuelve a entregar.
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "file-processing-dlq"
      maxReceiveCount = 3
    }
  }

  # Colas exclusivas de los tests de integración: el worker de desarrollo nunca les roba mensajes.
  file-processing-test-dlq {}

  file-processing-test {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "file-processing-test-dlq"
      maxReceiveCount = 3
    }
  }
}
